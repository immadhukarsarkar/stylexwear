<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard · StyleXWear</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #030307;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 100px auto;
      padding: 40px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      margin-bottom: 24px;
    }
    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- session validation -->
  <script>
    const session = sessionStorage.getItem('StyleXWear_adminSession') === 'active' || sessionStorage.getItem('StyleXWear_activeSessionId');
    if (!session) {
      window.location.replace('login.html');
    }
    function logout() {
      sessionStorage.clear();
      window.location.replace('login.html');
    }
  </script>

  <div class="container">
    <h1>StyleXWear Admin Console</h1>
    <p>This panel has been cleared. You can start building your customized Admin workflow console from scratch.</p>
    <button onclick="logout()">Logout Session</button>
  </div>
</body>
</html>
